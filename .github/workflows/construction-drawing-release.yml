name: Construction drawing Windows preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'mcp/**'
      - 'browser-extension/**'
      - 'install.ps1'
      - 'start.ps1'
      - 'build.ps1'
      - '.codex-plugin/plugin.json'
      - '.github/workflows/construction-drawing-release.yml'
permissions:
  contents: write
concurrency:
  group: drawing-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          architecture: x64
      - name: Protocol and native host tests
        run: node mcp/native-test.mjs
      - name: Page connection status regression
        run: node --test mcp/page-status.test.mjs mcp/monitor.test.mjs
      - name: Build complete portable package
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE '.'
          & (Join-Path $source 'build.ps1') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'drawing-release')
      - name: Verify extracted package and relocation
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'drawing-release'
          $archive = Get-ChildItem -LiteralPath $output -Filter '*.zip' | Select-Object -First 1
          $extracted = Join-Path $env:RUNNER_TEMP 'drawing-extracted'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extracted
          $package = (Get-ChildItem -LiteralPath $extracted -Directory | Select-Object -First 1).FullName
          $records = Get-Content -LiteralPath (Join-Path $package 'files.sha256.json') -Raw | ConvertFrom-Json
          foreach ($record in $records) {
            if ((Get-FileHash -LiteralPath (Join-Path $package $record.path)).Hash.ToLowerInvariant() -ne $record.sha256) { throw 'Package checksum mismatch' }
          }
          $relocated = Join-Path $env:RUNNER_TEMP 'Drawing relocated test'
          & (Join-Path $package 'start.ps1') -InstallDirectory $relocated -PrepareOnly -NoOpen
          & (Join-Path $relocated 'runtime/node.exe') (Join-Path $relocated 'mcp/native-test.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Portable protocol tests failed' }
          $a = Get-FileHash -LiteralPath (Join-Path $relocated '.agents/skills/kujiale-drawing-bridge/SKILL.md')
          $b = Get-FileHash -LiteralPath (Join-Path $relocated '.claude/skills/kujiale-drawing-bridge/SKILL.md')
          if ($a.Hash -ne $b.Hash) { throw 'Skill mirrors differ' }
          if (!(Test-Path -LiteralPath (Join-Path $relocated '.codex/config.toml'))) { throw 'MCP project config missing' }
          $sum = (Get-FileHash -LiteralPath $archive.FullName).Hash.ToLowerInvariant() + '  ' + $archive.Name
          Set-Content -LiteralPath ($archive.FullName + '.sha256') -Value $sum -Encoding utf8
      - name: Verify native registration and compiled manager
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE '.'
          $target = Join-Path $env:RUNNER_TEMP 'Drawing manager registration test'
          & (Join-Path $source 'install.ps1') -InstallDirectory $target
          $expected = Join-Path $target 'native-host.json'
          foreach ($browser in @('Google\Chrome','Microsoft\Edge')) {
            $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(('Software\' + $browser + '\NativeMessagingHosts\com.kujiale.construction_drawing'))
            if (!$key) { throw 'Native host registration missing' }
            try { if ($key.GetValue('') -ne $expected) { throw 'Native host registration path mismatch' } } finally { $key.Dispose() }
          }
          $test = Start-Process -FilePath (Join-Path $target 'DrawingBridgeManager.exe') -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Desktop manager self-test failed' }
          & (Join-Path $target 'runtime/node.exe') (Join-Path $target 'mcp/manager-watch.mjs') --once
          if ($LASTEXITCODE -ne 0) { throw 'Unified status query failed' }
          & (Join-Path $target 'install.ps1') -InstallDirectory $target
      - name: Retain build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: construction-drawing-windows
          path: |
            ${{ runner.temp }}/drawing-release/*.zip
            ${{ runner.temp }}/drawing-release/*.sha256
          retention-days: 14
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE '.'
          $version = (Get-Content -LiteralPath (Join-Path $source '.codex-plugin/plugin.json') -Raw | ConvertFrom-Json).version
          $tag = 'drawing-v' + $version
          $archive = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'drawing-release') -Filter '*.zip' | Select-Object -First 1
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Version already released. Bump the drawing package version instead of replacing it.' }
          gh release create $tag $archive.FullName ($archive.FullName + '.sha256') --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title ('Construction Drawing Bridge ' + $version + ' Windows preview') --notes-file (Join-Path $source 'RELEASE-NOTES.md') --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }

