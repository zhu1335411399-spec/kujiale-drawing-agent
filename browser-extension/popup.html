<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>施工图页面检查</title>
<style>
body{width:410px;margin:18px;font:14px system-ui,sans-serif;color:#243047}h2{font-size:19px;margin:0 0 12px}section{border:1px solid #dce2eb;border-radius:10px;padding:13px;margin:12px 0}h3{margin:0 0 8px;font-size:15px}p{line-height:1.6;margin:6px 0}.ok{color:#087647}.pending{color:#946008}.detail{color:#657084;font-size:12px;overflow-wrap:anywhere}button{background:#2159da;color:white;border:0;border-radius:7px;padding:9px 16px;cursor:pointer}button:disabled{opacity:.55}
</style>
<h2>施工图页面检查 · 0.5.2</h2>
<p id="scope" class="detail">仅检测当前浏览器用户配置，不包含另一浏览器</p>
<section><h3>本浏览器：后端配置页面</h3><div id="config"></div></section>
<section><h3>本浏览器：前端设计器页面</h3><div id="design"></div></section>
<p id="status" role="status">正在检测…</p>
<button id="refresh">重新检测页面</button>
<p class="detail">Chrome 后端和 Edge 前端请分别在各自扩展中查看；Agent 可汇总两个浏览器。设计器可访问不代表已进入“图纸&amp;清单”，账号、客户配置、模板及验收结果另行核验。</p>
<section><h3>本机服务连接（独立状态）</h3><p id="mcpStatus" role="status"></p><button id="connect">重新连接</button> <button id="disconnect">暂停</button><p id="mcpDetail" class="detail"></p></section>
<script type="module" src="popup.js"></script>
<script type="module" src="native-status.js"></script>
</html>
